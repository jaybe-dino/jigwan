  new naver.maps.Polyline({map:VMAP,path:[nLatLng(backPt),nLatLng(d.coord),nLatLng(frontPt)],strokeColor:seal,strokeWeight:2,strokeOpacity:.5,strokeStyle:'shortdash'});
  new naver.maps.Marker({position:nLatLng(d.coord),map:VMAP,zIndex:100,icon:{content:'<div class="vdot"></div>',anchor:new naver.maps.Point(9,9)}});
  const g=(brg,dist,role,name,icon,cls)=>{ if(!name) return; const p=llOffset(lat,lon,dist,brg);
    new naver.maps.Marker({position:nLatLng(p),map:VMAP,icon:{content:`<div class="vlmk ${cls}"><b>${icon} ${role}</b>${name}</div>`,anchor:new naver.maps.Point(0,0)}}); };
  g(backBrg,820,'현무(뒷산)',lm.back,'⛰️','back');
  g((facing+90)%360,560,'청룡(좌)',lm.left,'⛰️','left');
  g((facing-90+360)%360,560,'백호(우)',lm.right,'⛰️','right');
  g(facing,540,lm.water?'득수(물)':'주작(앞)',lm.water||lm.front,lm.water?'💧':'🏞️','front');
  [200,600].forEach(t=>setTimeout(()=>{ if(VMAP&&naverOK()) naver.maps.Event.trigger(VMAP,'resize'); },t));
}

/* 레퍼럴 코드 */
function genCode(){ return 'j'+Math.random().toString(36).slice(2,8); }
let MYCODE=localStorage.getItem('jg_ref')||genCode(); localStorage.setItem('jg_ref',MYCODE);
const INVITER=new URLSearchParams(location.search).get('ref')||'';
let SEX='1', LASTD=null, LASTC=null;

/* 초기화 */
(function init(){
  const yy=$('#yy'),mm=$('#mm'),dd=$('#dd'),hh=$('#hh');
  for(let y=2015;y>=1955;y--) yy.appendChild(new Option(y+'년',y));
  for(let m=1;m<=12;m++) mm.appendChild(new Option(m+'월',m));
  for(let d=1;d<=31;d++) dd.appendChild(new Option(d+'일',d));
  yy.value=1995; mm.value=5; dd.value=15;
  hh.appendChild(new Option('시간 모름',''));
  for(let h=0;h<24;h++) hh.appendChild(new Option(String(h).padStart(2,'0')+':00',h));
  $('#sex').querySelectorAll('button').forEach(b=>b.onclick=()=>{ SEX=b.dataset.v; $('#sex').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#go').onclick=run;
  if(INVITER){ $('#refWelcome').style.display='block'; $('#refWelcome').innerHTML='🎁 친구가 초대했어요! 나도 우리 집 풍수·궁합 보고 유형 모으기'; }
  fetch('/api/ref?action=leaderboard').then(r=>r.json()).then(d=>{ if(d.totalUsers) $('#totalStat').innerHTML='지금까지 <b>'+d.totalUsers.toLocaleString()+'명</b>이 터를 봤어요'; }).catch(()=>{});
})();

async function geocode(q){
  return new Promise(res=>{
    if(!(naverOK()&&naver.maps.Service&&naver.maps.Service.geocode)) return res(null);
    try{ naver.maps.Service.geocode({query:q},(st,resp)=>{
      const a=(st===naver.maps.Service.Status.OK)&&resp.v2&&resp.v2.addresses&&resp.v2.addresses[0];
      res(a&&a.y&&a.x?{lat:+a.y,lon:+a.x,addr:a.roadAddress||a.jibunAddress||q}:null);
    }); }catch(_){ res(null); }
    setTimeout(()=>res(null),4500);
  });
}
async function run(){
  const q=($('#addr').value||'').trim();
  if(!q){ $('#addr').focus(); toast('집 주소(동네)를 넣어주세요'); return; }
  $('#intro').style.display='none'; $('#load').classList.add('on');
  ['터를 읽는 중…','산과 물길을 확인 중…','사주와 궁합을 보는 중…'].forEach((m,i)=>setTimeout(()=>{ if($('#load').classList.contains('on')) $('#loadMsg').textContent=m; }, i*2600));
  try{
    const g=await geocode(q);
    const qs = g ? ('lat='+g.lat.toFixed(6)+'&lon='+g.lon.toFixed(6)) : ('address='+encodeURIComponent(q));
    const d=await (await fetch('/api/assess?'+qs)).json();
    if(!d||d.error) throw new Error('assess');
    if(g) d.addr=g.addr;
    const y=+$('#yy').value,m=+$('#mm').value,day=+$('#dd').value,hv=$('#hh').value;
    const cqs=`facing=${d.facing||180}&sect=${encodeURIComponent(d.houseSect||'동사택')}&y=${y}&m=${m}&d=${day}&male=${SEX}`+(hv!==''?`&hour=${hv}`:'');
    let c=null; try{ c=await (await fetch('/api/compat?'+cqs)).json(); if(c&&c.error)c=null; }catch(_){}
    LASTD=d; LASTC=c;
    // 레퍼럴 등록
    fetch('/api/ref',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code:MYCODE,invitedBy:INVITER,terbti:(d.terbti||{}).code,region:d.region})}).catch(()=>{});
    renderResult(d,c);
  }catch(e){
    $('#load').classList.remove('on'); $('#intro').style.display='block';
    toast('잠시 후 다시 시도해 주세요');
  }
}

function renderResult(d,c){
  $('#load').classList.remove('on');
  const tb=(d.terbti&&TB[d.terbti.code])?TB[d.terbti.code]:TB.sun;
  const code=(d.terbti||{}).code||'sun';
  const tip=(d.advice&&d.advice[0]);
  const pct=c?c.percent:null;
  let html='';
  // 터BTI 카드
  html+=`<div class="tbcard" style="background:linear-gradient(150deg,${tb.c1},${tb.c2})">
    <div class="tbart">${tbArt(code)}</div>
    <div class="tbin">
      <span class="rar">✨ ${tb.rt} 유형 · 상위 ${tb.rp}%</span>
      <div class="tbtop"><div class="tbemoji">${tb.e}</div>
        <div class="tbname"><small>${d.region||'우리 집'} · 우리 집 유형</small><b>${tb.n}</b><span>${tb.t}</span></div></div>
      <div class="tbdesc">${(d.terbti&&d.terbti.desc)||''}</div>
    </div></div>`;
  // 점수 + 궁합
  html+=`<div class="bigrow">
    <div class="bigbox"><div class="t">이 집 풍수</div><div class="v">${d.site_score}<small>점</small></div><div class="s">「${d.grade}」</div></div>
    ${pct!=null?`<div class="bigbox"><div class="t">나와 궁합</div><div class="v jae">${pct}<small>%</small></div><div class="s">${c.caption||''}</div></div>`:''}
  </div>`;
  // 지도 (풍수 오버레이) + 해석
  html+=`<div class="vmap"><div id="vmapHost"></div></div>
    <div class="vlegend"><span><i style="background:#2f9e6f"></i>현무</span><span><i style="background:#3B82F6"></i>청룡</span><span><i style="background:#8b94a3"></i>백호</span><span><i style="background:#2f8fd8"></i>득수</span><span>┈ 배산임수 축</span></div>`;
  if(d.interp&&d.interp.body){
    html+=`<div class="vcard"><div class="h">🧭 풍수 해석 · ${d.region||''}</div><div class="body">${d.interp.body}</div>`;
    if(d.profile&&d.profile.length){
      html+=`<div class="vprof">`+d.profile.filter(p=>p.k.indexOf('주변')<0).slice(0,5).map(p=>{
        const cl=p.ok>0?'good':(p.ok<0?'jae':'');
        return `<div class="vpr"><div class="k">${p.k.replace(/\(.*\)/,'')}</div><div class="v"><b class="${cl}">${p.v}</b><small>${p.d}</small></div></div>`;}).join('')+`</div>`;
    }
    html+=`</div>`;
  }
  // 조언
  if(d.advice&&d.advice.length){
    html+='<div class="advice"><div class="h">🌿 오늘 바로 할 개운 처방</div>'+
      d.advice.slice(0,2).map(a=>`<div class="ad"><div class="i">${a.icon}</div><div><b>${a.title}</b><p>✔ ${a.action}</p></div></div>`).join('')+'</div>';
  }
  // 공유
  html+=`<div class="share-row">
    <button class="btn" onclick="shareResult()">💬 공유하기</button>
    <button class="btn ghost" onclick="restart()">다른 집 보기</button></div>`;
  // 초대
  const link=location.origin+'/v?ref='+MYCODE;
  html+=`<div class="invite">
    <h3>친구 초대하고 순위 올리기 🏆</h3>
    <p>친구가 이 링크로 들어와 결과를 보면 내 초대 수가 올라가요.</p>
    <div class="reflink"><input id="reflink" value="${link}" readonly><button onclick="copyRef()">복사</button></div>
    <div class="invited" id="invitedBox"></div>
  </div>`;
  // 도감
  const keys=Object.keys(TB);
  const collected=JSON.parse(localStorage.getItem('jg_dex')||'[]');
  if(!collected.includes(code)){ collected.push(code); localStorage.setItem('jg_dex',JSON.stringify(collected)); }
  html+=`<div class="dex"><div class="hd"><h3>터BTI 도감</h3><span class="cnt">${collected.length}/${keys.length} 수집</span></div>
    <div class="dexgrid">${keys.map(k=>{ const t=TB[k]; const has=collected.includes(k); const mine=k===code;
      return has?`<div class="dexc ${mine?'mine':''}" style="background:linear-gradient(150deg,${t.c1},${t.c2})">${mine?'<span class="badge">내 유형</span>':''}<div class="e">${t.e}</div><div class="n">${t.n}</div><div class="g">${t.t}</div></div>`
        :`<div class="dexc locked"><div class="e">🔒</div><div class="n">???</div><div class="g">다른 집을 감정하면 해금</div></div>`; }).join('')}</div>
    <div class="small" style="margin-top:10px">다른 집·친구 집 주소로 감정하면 새 유형이 열려요</div></div>`;
  html+=`<div class="small">지관 · 실제 지형(OSM·DEM)과 만세력 기반 · 참고·오락용<br><a href="/">전체 지도 서비스 열기 →</a></div>`;
  $('#resultBody').innerHTML=html;
  $('#result').classList.add('on'); window.scrollTo(0,0);
  drawViralMap(d);
  loadInvited();
}
function loadInvited(){
  fetch('/api/ref?code='+MYCODE).then(r=>r.json()).then(d=>{
    const box=$('#invitedBox'); if(!box) return;
    const n=d.count||0;
    let h=`<div class="hd">내가 초대한 친구 · <b style="color:var(--seal)">${n}명</b>${d.rank?` · 전국 ${d.rank}위`:''}</div>`;
    if(n>0){ h+=(d.invited||[]).slice(0,12).map(u=>{ const t=TB[u.terbti]; return `<span class="ichip">${t?t.e:'🏠'} ${t?t.n:'터'}${u.region?' · '+u.region:''}</span>`; }).join(''); }
    else { h+=`<div class="crown">아직 없어요 — 링크를 공유해 첫 친구를 초대해보세요!</div>`; }
    box.innerHTML=h;
  }).catch(()=>{});
}
function copyRef(){ const el=$('#reflink'); el.select(); const link=el.value;
  (navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('초대 링크 복사됨! 카톡에 붙여넣기 🎉')).catch(()=>toast(link)); }
async function shareResult(){
  const d=LASTD,c=LASTC; const tb=TB[(d.terbti||{}).code]||TB.sun;
  const link=location.origin+'/v?ref='+MYCODE;
  const txt=`우리 집은 ${tb.n} ${tb.e} (${tb.rt}·상위 ${tb.rp}%) · 풍수 ${d.site_score}점${c?`, 나와 궁합 ${c.percent}%`:''}\n너네 집은? 나랑 터가 잘 맞나 👉`;
  if(navigator.share){ try{ await navigator.share({title:'지관',text:txt,url:link}); return; }catch(_){ } }
  (navigator.clipboard?navigator.clipboard.writeText(txt+' '+link):Promise.reject()).then(()=>toast('공유 문구 복사됨! 붙여넣기 하세요')).catch(()=>toast(link));
}
function restart(){ $('#result').classList.remove('on'); $('#intro').style.display='block'; $('#addr').value=''; window.scrollTo(0,0); }
window.shareResult=shareResult; window.copyRef=copyRef; window.restart=restart;
</script>
